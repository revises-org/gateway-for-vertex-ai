[package]
name = "gateway-for-vertex-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["Huy Nguyen Nhu"]
description = "OpenAI-compatible gateway for Vertex AI: keeps Google Cloud credentials, refreshes tokens, preserves Gemini thought signatures"
repository = "https://github.com/YOUR_USERNAME/gateway-for-vertex-ai"
license = "Apache-2.0"
readme = "README.md"
keywords = ["vertex-ai", "gemini", "openai", "gateway", "proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]
exclude = ["/.github", "/dist"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
axum = "0.8"
gcp_auth = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
